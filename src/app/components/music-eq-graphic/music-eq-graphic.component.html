<div class="rounded-2xl border border-white/10 bg-white/5 p-4">
  <div class="overflow-x-auto pb-2" role="group" aria-label="Graphic equalizer bands">
    <div class="mx-auto flex min-w-max justify-center gap-1 sm:gap-2">
      @for (c of cols(); track $index) {
        <div class="flex w-11 flex-col items-center gap-1" [attr.data-band]="$index">
          <span class="text-[11px] tabular-nums text-gray-400" aria-hidden="true">{{ fmt(c.gain) }}</span>
          <div class="relative h-44 w-10">
            <span class="pointer-events-none absolute left-1/2 top-1/2 h-px w-6 -translate-x-1/2 bg-white/15" aria-hidden="true"></span>
            <input type="range" [min]="-range" [max]="range" step="0.1" [value]="c.gain"
              [attr.aria-label]="c.label + ' Hz gain'" [attr.aria-valuetext]="fmt(c.gain) + ' dB'"
              (input)="setGain($index, $any($event.target).value)" (dblclick)="resetBand($index)"
              [title]="'Double-click to reset ' + c.label + ' Hz'"
              class="absolute left-1/2 top-1/2 h-10 w-44 -translate-x-1/2 -translate-y-1/2 -rotate-90 cursor-pointer accent-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400" />
          </div>
          <span class="text-xs font-medium text-gray-300" aria-hidden="true">{{ c.label }}</span>
        </div>
      }
    </div>
  </div>
  <p class="mt-2 text-xs text-gray-400">Range ±{{ range }} dB. Double-click a slider to reset it; arrow keys nudge by 0.1 dB.</p>

  <form class="mt-4 flex flex-wrap items-center gap-2" (submit)="$event.preventDefault(); saveCurrent()">
    <label class="sr-only" for="music-eq-preset-name">Name for the custom preset</label>
    <input id="music-eq-preset-name" type="text" maxlength="60" placeholder="Name this curve" [value]="presetName()"
      (input)="presetName.set($any($event.target).value)"
      class="h-10 min-w-0 flex-1 rounded-lg border border-white/10 bg-white/5 px-3 text-sm text-white placeholder-gray-500 focus:border-indigo-400 focus:outline-none sm:max-w-xs" />
    <button type="submit"
      class="h-10 rounded-full bg-indigo-600 px-4 text-sm font-medium text-white hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">Save preset</button>
  </form>

  @if (graph.customPresets().length > 0) {
    <ul class="mt-3 flex flex-wrap gap-2" aria-label="Your presets">
      @for (p of graph.customPresets(); track p.id) {
        <li class="flex items-center overflow-hidden rounded-full border border-white/10 bg-white/5 text-sm">
          <span class="max-w-[10rem] truncate py-2 pl-3 pr-1 text-gray-300" [title]="p.name">{{ p.name }}</span>
          <button type="button" (click)="deleteCustom(p.id, p.name)" [attr.aria-label]="'Delete preset ' + p.name"
            class="flex h-10 w-10 items-center justify-center text-gray-400 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </li>
      }
    </ul>
  }
</div>
