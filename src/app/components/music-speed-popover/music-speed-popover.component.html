<div (keydown)="onKeydown($event)">
  <button type="button" data-speed-trigger (click)="toggle()" aria-label="Playback speed" aria-haspopup="dialog" [attr.aria-expanded]="open()"
    class="flex h-10 min-w-10 items-center justify-center rounded-full px-2 text-xs font-semibold tabular-nums hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
    [class.text-indigo-400]="player.playbackRate() !== 1" [class.text-gray-300]="player.playbackRate() === 1">{{ label(player.playbackRate()) }}</button>
  @if (open()) {
    <div role="dialog" aria-label="Playback speed" class="absolute bottom-full right-0 z-[45] mb-2 w-52 rounded-xl border border-white/10 bg-[#121212] p-3 shadow-2xl">
      <div class="grid grid-cols-3 gap-2">
        @for (r of presets; track r) {
          <button type="button" (click)="choose(r)" [attr.aria-pressed]="player.playbackRate() === r"
            class="h-9 rounded-full text-xs font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
            [class.bg-white]="player.playbackRate() === r" [class.text-black]="player.playbackRate() === r"
            [class.bg-white/5]="player.playbackRate() !== r" [class.text-gray-300]="player.playbackRate() !== r">{{ label(r) }}</button>
        }
      </div>
      <button type="button" role="switch" (click)="player.setPreservesPitch(!player.preservesPitch())" [attr.aria-checked]="player.preservesPitch()"
        class="mt-3 flex h-10 w-full items-center justify-between rounded-lg px-2 text-sm text-gray-300 hover:bg-white/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
        <span>Keep pitch</span>
        <span class="relative h-5 w-9 rounded-full transition-colors motion-reduce:transition-none" [class.bg-indigo-600]="player.preservesPitch()" [class.bg-white/20]="!player.preservesPitch()" aria-hidden="true">
          <span class="absolute top-0.5 h-4 w-4 rounded-full bg-white transition-all motion-reduce:transition-none" [class.left-4]="player.preservesPitch()" [class.left-0.5]="!player.preservesPitch()"></span>
        </span>
      </button>
    </div>
  }
</div>
