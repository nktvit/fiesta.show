<div class="group text-center">
  <div class="relative">
    <a [routerLink]="['/music/artist', artist().id]" tabindex="-1" aria-hidden="true" class="block">
      @if (artist().picture) {
        <img [src]="artist().picture" alt="" width="320" height="320" loading="lazy" decoding="async"
          class="mx-auto aspect-square w-full rounded-full bg-gray-800 object-cover transition-transform group-hover:scale-[1.02] motion-reduce:transition-none" />
      } @else {
        <div class="mx-auto aspect-square w-full rounded-full bg-gray-800"></div>
      }
    </a>
    <button type="button" (click)="play()" [attr.aria-label]="'Play ' + artist().name" [disabled]="busy()"
      class="absolute bottom-1 right-1 flex h-11 w-11 items-center justify-center rounded-full bg-indigo-600 text-white shadow-lg transition-opacity hover:bg-indigo-500 focus:outline-none focus-visible:opacity-100 focus-visible:ring-2 focus-visible:ring-indigo-400 motion-reduce:transition-none sm:opacity-0 sm:group-hover:opacity-100">
      @if (busy()) {
        <svg class="h-5 w-5 animate-spin motion-reduce:animate-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" stroke-linecap="round" /></svg>
      } @else {
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
      }
    </button>
    <div class="absolute right-1 top-1">
      <app-music-card-menu-button [item]="item()" />
    </div>
  </div>
  <a [routerLink]="['/music/artist', artist().id]" class="block focus:outline-none focus-visible:underline">
    <p class="mt-2 truncate text-sm font-medium group-hover:underline" [title]="artist().name">{{ artist().name }}</p>
  </a>
</div>
