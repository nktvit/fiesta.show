<div class="w-full relative bg-black" style="aspect-ratio: 16 / 9;">
  @if (masterUrl()) {
    <video
      #videoEl
      class="block w-full h-full"
      controls
      autoplay
      playsinline
    ></video>
  }

  @if (loading()) {
    <div class="absolute inset-0 flex items-center justify-center text-gray-300">
      <svg class="w-6 h-6 mr-2 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span class="text-sm">Loading stream…</span>
    </div>
  } @else if (errorMsg()) {
    <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 px-4 text-center">
      <svg class="w-6 h-6 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
      <span class="text-sm">Stream unavailable</span>
      <span class="text-xs mt-1 opacity-70">{{ errorMsg() }}</span>
    </div>
  } @else if (!masterUrl()) {
    <div class="absolute inset-0 flex items-center justify-center text-gray-500">
      <span class="text-sm">No video source available</span>
    </div>
  }

  @if (isPreview() && masterUrl()) {
    <div class="absolute top-2 right-2 z-20 flex items-center gap-1.5 rounded-md bg-black/75 px-2 py-1 font-mono text-[10px] leading-none text-white/90 ring-1 ring-white/10">
      <span class="rounded bg-emerald-500/90 px-1 py-0.5 font-semibold uppercase tracking-wide text-black">{{ env() }}</span>
      <span class="text-white/60">source:</span>
      <span [class]="segmentSource() === 'relay' ? 'text-emerald-400 font-semibold' : segmentSource() === 'proxy' ? 'text-amber-400 font-semibold' : segmentSource() === 'direct' ? 'text-sky-400 font-semibold' : 'text-white/40'">{{ segmentSource() ?? '…' }}</span>
    </div>
  }
</div>
