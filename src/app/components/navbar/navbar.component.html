<!-- On mobile this is a slim brand-only bar: primary navigation lives in
     <app-bottom-nav>. The links, the Genres dropdown and the search box are all
     sm:+ only — /search renders its own field in the page body, so nothing here
     is ever the mobile search input. -->
<header class="flex flex-wrap sm:justify-start sm:flex-nowrap w-full text-sm py-3 md:py-4 transition-all duration-500 motion-reduce:transition-none"
  [ngClass]="transparent()
    ? (scrolled ? 'bg-black/40 backdrop-blur-lg' : 'bg-gradient-to-b from-black/80 via-black/40 to-transparent')
    : 'bg-[#0a0a0a] border-b border-white/5'">
  <nav class="w-full mx-auto px-4 md:px-12 lg:px-16 flex flex-wrap basis-full items-center justify-between"
    aria-label="Global">
    <a class="sm:order-1 md:mb-0 flex-none text-xl font-bold tracking-tight" [routerLink]="['/']"
      [ngClass]="transparent() ? 'text-white' : 'text-gray-900 dark:text-white'">
      Stream Fiesta
    </a>
    <!-- Wrapper div, not the component host: search-box.component.css sets
         `:host { display: block }`, and component styles land after the global
         stylesheet, so `hidden` on the host loses the cascade. -->
    @if (showSearchBox()) {
      <div class="hidden sm:order-3 sm:block sm:w-72 md:w-80">
        <app-search-box [surface]="transparent() ? 'glass' : 'sunken'"></app-search-box>
      </div>
    }
    <div class="hidden sm:block sm:grow-0 sm:basis-auto sm:order-2">
      <div class="flex flex-col gap-4 mt-4 sm:flex-row sm:items-center sm:mt-0 sm:ps-6">
        <a class="font-medium text-sm transition-colors"
          [ngClass]="currentPage === '/'
            ? (transparent() ? 'text-white font-semibold' : 'text-indigo-600 dark:text-indigo-400 font-semibold')
            : (transparent() ? 'text-gray-300 hover:text-white' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white')"
          [routerLink]="['/']">Home</a>
        <a class="font-medium text-sm transition-colors"
          [ngClass]="currentPage === '/tv'
            ? (transparent() ? 'text-white font-semibold' : 'text-indigo-600 dark:text-indigo-400 font-semibold')
            : (transparent() ? 'text-gray-300 hover:text-white' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white')"
          [routerLink]="['/tv']">TV Shows</a>
        <a class="font-medium text-sm transition-colors"
          [ngClass]="currentPage === '/top-rated'
            ? (transparent() ? 'text-white font-semibold' : 'text-indigo-600 dark:text-indigo-400 font-semibold')
            : (transparent() ? 'text-gray-300 hover:text-white' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white')"
          [routerLink]="['/top-rated']">Top Rated</a>
        <!-- Genre dropdown -->
        <div class="relative genre-dropdown">
          <button (click)="isGenreOpen = !isGenreOpen"
            class="font-medium text-sm transition-colors flex items-center gap-1"
            [ngClass]="currentPage.startsWith('/genre')
              ? (transparent() ? 'text-white font-semibold' : 'text-indigo-600 dark:text-indigo-400 font-semibold')
              : (transparent() ? 'text-gray-300 hover:text-white' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white')">
            Genres
            <svg class="w-3.5 h-3.5 transition-transform" [ngClass]="{'rotate-180': isGenreOpen}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          @if (isGenreOpen) {
            <div class="sm:absolute left-0 top-full mt-2 w-56 max-h-72 overflow-y-auto rounded-lg shadow-xl border py-1 z-50
              bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700">
              @for (genre of genres; track genre.id) {
                <a [routerLink]="['/genre', genre.id]"
                  (click)="isGenreOpen = false"
                  class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                  {{ genre.name }}
                </a>
              }
            </div>
          }
        </div>
      </div>
    </div>
  </nav>
</header>
