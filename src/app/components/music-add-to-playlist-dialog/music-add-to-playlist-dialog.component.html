<app-music-dialog title="Add to playlist" [open]="ui.addToPlaylist() !== null" (openChange)="!$event && ui.closeAddToPlaylist()" size="sm">
  <p class="mb-3 text-xs text-gray-400">{{ count() }} {{ count() === 1 ? 'track' : 'tracks' }} selected</p>

  @if (creating()) {
    <form (submit)="$event.preventDefault(); create()" class="mb-3 flex gap-2">
      <input type="text" name="newPlaylistName" [(ngModel)]="newName" maxlength="100" placeholder="Playlist name" aria-label="New playlist name" required
        class="h-11 min-w-0 flex-1 rounded-lg border border-white/10 bg-white/5 px-3 text-sm text-white placeholder-gray-500 focus:border-indigo-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400" />
      <button type="submit" [disabled]="!newName.trim()"
        class="h-11 rounded-lg bg-indigo-600 px-4 text-sm font-medium text-white hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 disabled:opacity-50">Create</button>
    </form>
  } @else {
    <button type="button" (click)="creating.set(true)"
      class="mb-3 flex h-11 w-full items-center gap-2 rounded-lg px-3 text-left text-sm font-medium text-indigo-400 hover:bg-white/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      New playlist
    </button>
  }

  @if (library.playlists().length) {
    <input type="search" [value]="filter()" (input)="filter.set($any($event.target).value)" placeholder="Filter playlists" aria-label="Filter playlists"
      class="mb-2 h-11 w-full rounded-lg border border-white/10 bg-white/5 px-3 text-sm text-white placeholder-gray-500 focus:border-indigo-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400" />
  }

  <ul class="space-y-1">
    @for (p of visible(); track p.id) {
      <li>
        <button type="button" (click)="add(p.id, p.name)"
          class="flex h-11 w-full items-center justify-between gap-3 rounded-lg px-3 text-left text-sm hover:bg-white/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
          <span class="truncate" [title]="p.name">{{ p.name }}</span>
          <span class="flex-shrink-0 text-xs text-gray-400">{{ p.tracks.length }} {{ p.tracks.length === 1 ? 'track' : 'tracks' }}</span>
        </button>
      </li>
    } @empty {
      <li class="px-3 py-4 text-sm text-gray-400">{{ library.playlists().length ? 'No playlist matches.' : 'You have no playlists yet.' }}</li>
    }
  </ul>
</app-music-dialog>
