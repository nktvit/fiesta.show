@if (open()) {
  <div class="fixed inset-0 z-[45]" [style.bottom.px]="isDesktop() && barInset() ? barInset() : null" (keydown)="onKeydown($event)">
    <div class="absolute inset-0 bg-black/60 sm:bg-black/30" (click)="close()" aria-hidden="true"></div>
    <section role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId"
      cdkTrapFocus [cdkTrapFocusAutoCapture]="true"
      class="absolute inset-x-0 bottom-0 flex max-h-[85vh] flex-col rounded-t-2xl border-t border-white/10 bg-[#121212]/95 pb-[env(safe-area-inset-bottom,0px)] text-white shadow-2xl sm:inset-y-0 sm:left-auto sm:right-0 sm:max-h-none sm:rounded-none sm:border-l sm:border-t-0 sm:pb-0"
      [class.backdrop-blur-md]="!settings.reduceBlur()"
      [style.width.px]="isDesktop() ? width() : null"
      [style.transform]="dragY() ? 'translateY(' + dragY() + 'px)' : null">

      <div role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"
        [attr.aria-valuenow]="width()" [attr.aria-valuemin]="minWidth" [attr.aria-valuemax]="maxWidth"
        (pointerdown)="startResize($event)" (keydown)="resizeKey($event)"
        class="absolute inset-y-0 left-0 hidden w-2 -translate-x-1/2 cursor-ew-resize touch-none hover:bg-indigo-400/40 focus:outline-none focus-visible:bg-indigo-400/60 sm:block"></div>

      <div class="flex touch-none justify-center pt-2 sm:hidden" (pointerdown)="startDrag($event)" aria-hidden="true">
        <span class="h-1.5 w-10 rounded-full bg-white/25"></span>
      </div>

      <header class="flex items-center gap-2 px-4 py-3">
        <h2 [id]="titleId" class="min-w-0 flex-1 truncate text-base font-semibold" [title]="title()">{{ title() }}</h2>
        <ng-content select="[panelActions]" />
        <button type="button" (click)="close()" aria-label="Close"
          class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full text-gray-400 hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </header>

      <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-2 pb-4">
        <ng-content />
      </div>
    </section>
  </div>
}
