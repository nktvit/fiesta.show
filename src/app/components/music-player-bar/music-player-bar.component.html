@if (player.track(); as t) {
  <section aria-label="Music player"
    class="fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom,0px))] z-30 border-t border-white/10 bg-[#121212]/95 backdrop-blur-md sm:bottom-0">
    <div class="mx-auto flex max-w-screen-2xl items-center gap-3 px-3 py-2 md:px-12 lg:px-16">
      <a [routerLink]="t.albumId ? ['/music/album', t.albumId] : ['/music']" class="flex min-w-0 flex-1 items-center gap-3 sm:flex-none sm:basis-64">
        @if (t.cover) {
          <img [src]="t.cover" alt="" width="44" height="44" class="h-11 w-11 flex-shrink-0 rounded object-cover" />
        }
        <span class="min-w-0">
          <span class="block truncate text-sm font-medium text-white">{{ t.title }}</span>
          <span class="block truncate text-xs" [class.text-gray-400]="!message()" [class.text-amber-400]="message()">
            {{ message() ?? t.artist }}
          </span>
        </span>
      </a>

      <div class="flex items-center gap-1">
        <button type="button" (click)="player.prev()" aria-label="Previous track"
          class="hidden h-10 w-10 items-center justify-center rounded-full text-gray-300 hover:text-white sm:flex">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5.5v13a.5.5 0 0 1-.8.4L10 12.4a.5.5 0 0 1 0-.8l9.2-6.5a.5.5 0 0 1 .8.4z" /></svg>
        </button>
        <button type="button" (click)="player.toggle()" [attr.aria-label]="player.playing() ? 'Pause' : 'Play'"
          class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-black transition-transform active:scale-95 motion-reduce:transition-none">
          @if (player.loading() && !player.error()) {
            <svg class="h-5 w-5 animate-spin motion-reduce:animate-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" stroke-linecap="round" /></svg>
          } @else if (player.playing()) {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
          } @else {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
          }
        </button>
        <button type="button" (click)="player.next()" [disabled]="!player.hasNext()" aria-label="Next track"
          class="flex h-10 w-10 items-center justify-center rounded-full text-gray-300 hover:text-white disabled:opacity-30">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5.5v13a.5.5 0 0 0 .8.4L14 12.4a.5.5 0 0 0 0-.8L4.8 5.1a.5.5 0 0 0-.8.4z" /></svg>
        </button>
      </div>

      <div class="hidden flex-1 items-center gap-2 sm:flex">
        <span class="w-9 text-right text-xs tabular-nums text-gray-400">{{ time(player.position()) }}</span>
        <input type="range" min="0" [max]="player.duration()" step="1" [value]="player.position()"
          (input)="onSeek($event)" aria-label="Seek"
          class="h-1 flex-1 cursor-pointer accent-indigo-500" />
        <span class="w-9 text-xs tabular-nums text-gray-400">{{ time(player.duration()) }}</span>
      </div>

      @if (badge()) {
        <span class="hidden flex-shrink-0 rounded-full border px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide md:inline"
          [class.border-indigo-400]="badge() !== 'Preview'" [class.text-indigo-300]="badge() !== 'Preview'"
          [class.border-amber-400]="badge() === 'Preview'" [class.text-amber-300]="badge() === 'Preview'"
          [title]="badge() === 'Preview' ? 'Sign in with TIDAL to hear full tracks' : ''">{{ badge() }}</span>
      }
      <button type="button" (click)="player.stop()" aria-label="Close player"
        class="hidden h-9 w-9 items-center justify-center rounded-full text-gray-500 hover:text-white sm:flex">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>
    <!-- Thin progress line on mobile, where the seek slider is hidden. -->
    <div class="h-0.5 w-full bg-white/10 sm:hidden" aria-hidden="true">
      <div class="h-full bg-indigo-400" [style.width.%]="player.duration() ? (player.position() / player.duration()) * 100 : 0"></div>
    </div>
  </section>
}
