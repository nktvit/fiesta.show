<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Stream Fiesta — Watch Movies & TV Shows Free</title>
  <base href="/">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
       values on notched iPhones — without it the bottom nav sits under the
       home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Watch trending movies, TV shows, and series for free. No subscription, no sign-up. Just press play.">
  <meta name="keywords" content="movies, tv shows, streaming, watch, online, free, no sign up, series">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stream Fiesta">
  <meta property="og:title" content="Stream Fiesta — Watch Movies & TV Shows Free">
  <meta property="og:description" content="Watch trending movies, TV shows, and series for free. No subscription, no sign-up. Just press play.">
  <meta property="og:url" content="https://fiesta.show">
  <meta property="og:image" content="https://fiesta.show/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Stream Fiesta — Watch Movies & TV Shows Free">
  <meta name="twitter:description" content="Watch trending movies, TV shows, and series for free. No subscription, no sign-up. Just press play.">
  <meta name="twitter:image" content="https://fiesta.show/assets/og-image.png">
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site-dark.webmanifest">
  <!-- The hero image and every poster come from here: open the connection now. -->
  <link rel="preconnect" href="https://image.tmdb.org">
  <!-- Home only: start the trending request and preload the hero backdrop before
       the Angular bundle has even downloaded (API -> JS -> image used to be a
       serial chain). MainComponent reuses window.__fiestaTrending, and its pick
       (src/app/pages/main/hero-pick.ts) must match the one below. ES5 on purpose. -->
  <script>
    (function () {
      try {
        if (location.pathname !== '/' || !window.fetch) return;
        var p = fetch('/api/tmdb?list=trending').then(function (r) { return r.ok ? r.json() : null; });
        window.__fiestaTrending = p;
        p.then(function (d) {
          var c = ((d && d.movies) || []).filter(function (m) { return m.Backdrop; }).slice(0, 5);
          if (!c.length) return;
          // Browsers without imagesrcset would preload the big file whatever the viewport.
          if (!('imageSrcset' in HTMLLinkElement.prototype)) return;
          var file = c[Math.floor(Date.now() / 86400000) % c.length].Backdrop.split('/').pop();
          var base = 'https://image.tmdb.org/t/p/';
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image';
          l.href = base + 'w1280/' + file;
          // Same candidates + sizes as the hero <img> (NgOptimizedImage), so the browser reuses this fetch.
          l.setAttribute('imagesrcset', base + 'w780/' + file + ' 780w, ' + base + 'w1280/' + file + ' 1280w');
          l.setAttribute('imagesizes', '(max-width: 640px) 60vw, 100vw');
          document.head.appendChild(l);
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
