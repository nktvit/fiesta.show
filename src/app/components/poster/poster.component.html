<div
  class="poster-container group select-none cursor-pointer transition-transform duration-300 ease-in-out hover:scale-105 min-w-16"
  [attr.role]="expandable() ? 'button' : 'link'"
  [attr.aria-expanded]="expandable() ? expanded() : null"
  tabindex="0"
  [attr.aria-label]="(expandable() ? 'Show details for ' : 'View details for ') + movie().Title"
  (click)="onCardActivate()"
  (keydown)="onCardKeydown($event)">

  <div class="poster-content relative w-full h-full bg-gray-800 rounded-lg">
    @if (loading) {
      <div class="absolute inset-0 rounded-lg bg-gray-800 animate-pulse"></div>
    }
    @if (imageUrl) {
      <img
        [ngSrc]="imageUrl"
        [alt]="movie().Title || 'Movie Poster'"
        fill
        [priority]="priority()"
        sizes="(max-width: 640px) 45vw, (max-width: 1024px) 25vw, 15vw"
        (load)="onImageLoad()"
        (error)="onImageError()"
        class="rounded-lg object-cover group-hover:opacity-90 transition-opacity duration-200"
        >
    } @else if (!loading) {
      <div class="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-br from-gray-700 to-gray-800 rounded-lg p-3">
        <svg class="w-8 h-8 text-gray-500 mb-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
        </svg>
        <span class="text-gray-400 text-[10px] font-medium text-center leading-tight line-clamp-3">{{ movie().Title }}</span>
      </div>
    }

    <!-- Play on hover. A real anchor, not a decoration: it is the path to the
         movie page now that the card body expands in place instead of
         navigating, and it keeps /movie/:id in the crawlable markup. -->
    <div class="absolute inset-0 flex items-center justify-center opacity-0 scale-75 group-hover:opacity-100 group-hover:scale-100 focus-within:opacity-100 focus-within:scale-100 transition-all duration-300 ease-out">
      <a
        [routerLink]="movieLink"
        [queryParams]="movieQueryParams"
        (click)="$event.stopPropagation()"
        [attr.aria-label]="'Play ' + movie().Title"
        class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-black/60 backdrop-blur-sm ring-1 ring-white/20 shadow-lg hover:bg-black/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 transition-colors duration-200">
        <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z"/>
        </svg>
      </a>
    </div>

    @if (displayTitle()) {
      <div
        class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4 rounded-lg opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity duration-300 ease-in-out">
        <a
          [routerLink]="movieLink"
          [queryParams]="movieQueryParams"
          (click)="$event.stopPropagation()"
          class="text-white text-xs sm:text-base lg:text-md font-semibold line-clamp-3 hover:text-indigo-300 focus:outline-none focus-visible:underline transition-colors duration-200">{{ movie().Title }}</a>
      </div>
    }
  </div>
</div>
