<button
  (click)="toggleLike()"
  (pointerenter)="preloadBurst()"
  (focus)="preloadBurst()"
  type="button"
  [title]="likeCount() + ' like' + (likeCount() === 1 ? '' : 's') + ' on Fiesta'"
  class="relative inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-bold transition-all duration-300 cursor-pointer"
  [class]="liked()
    ? 'bg-gradient-to-r from-indigo-500 via-fuchsia-500 to-pink-500 text-white shadow-md shadow-fuchsia-500/30'
    : 'bg-gray-700/80 text-white hover:bg-gray-600'"
>
  <!-- The hearts spill into this canvas, not into canvas-confetti's default
       full-viewport one. Parenting it to the button anchors the burst by
       construction (it even scrolls with the pill), and the canvas edge then
       HARD-bounds every particle — no mistuned number can spray hearts over
       the hero photo again. It stays inert (no 2D context, library not even
       downloaded) until the first like; see fireHearts().
       Geometry is duplicated in BURST_W/BURST_H/BURST_ORIGIN in the .ts —
       change one, change both. It lives in Tailwind utilities rather than
       the stylesheet so it costs the 2 kB component-style budget nothing. -->
  <canvas #burstCanvas aria-hidden="true"
    class="pointer-events-none absolute left-1/2 -translate-x-1/2 -top-[70px] z-10 w-[170px] h-[120px]"></canvas>

  <!-- Both hearts stay mounted and cross-fade. Swapping them with @if
       destroyed and recreated the element on every toggle, which is why no
       transition could ever run across like/unlike. -->
  <span class="heart relative inline-flex shrink-0 w-3.5 h-3.5" [class.is-liked]="liked()" [class.is-bursting]="justLiked()">
    <svg class="heart-outline absolute inset-0 w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
    </svg>
    <svg class="heart-fill absolute inset-0 w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
    </svg>
  </span>
  <span [class.animate-count-pop]="justLiked()">Fiesta {{ likeCount() | number }}</span>
</button>
