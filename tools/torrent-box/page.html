<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torrent box</title>
<style>
  :root { color-scheme: dark; --bg:#0d0d10; --card:#17171c; --line:#2a2a33; --text:#e8e8ee; --dim:#8b8b99; --accent:#6366f1; --ok:#34d399; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 18px; margin: 0 0 14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  input[type=text], input[type=password] { flex:1; min-width:200px; background:var(--card); border:1px solid var(--line); color:var(--text); padding:9px 10px; border-radius:8px; }
  button, label.btn { background:var(--accent); color:#fff; border:0; padding:9px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:12px; }
  .name { font-weight:600; word-break:break-word; }
  .meta { color:var(--dim); font-size:12px; margin-top:2px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .bar.done > i { background:var(--ok); }
  .file { display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--line); font-size:13px; }
  .file span.n { flex:1; word-break:break-all; }
  .file small { color:var(--dim); white-space:nowrap; }
  video { width:100%; max-height:70vh; background:#000; border-radius:8px; margin-top:10px; }
  #msg { color:#f87171; min-height:18px; }
</style>
</head>
<body>
<main>
  <h1>Torrent box</h1>
  <div class="row"><input id="token" type="password" placeholder="access token" autocomplete="off"><button class="ghost" id="save">Save</button></div>
  <div class="row">
    <input id="magnet" type="text" placeholder="magnet:?xt=urn:btih:...">
    <button id="add">Add magnet</button>
    <label class="btn">.torrent file<input id="file" type="file" accept=".torrent,application/x-bittorrent" hidden></label>
  </div>
  <div id="msg" role="status"></div>
  <div id="list"></div>
  <video id="player" controls playsinline hidden></video>
</main>
<script>
const $ = (id) => document.getElementById(id);
const tokenBox = $('token');
tokenBox.value = localStorage.getItem('torrent-token') || '';
const token = () => tokenBox.value.trim();
$('save').onclick = () => { localStorage.setItem('torrent-token', token()); tick(); };

const fmt = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : (n / 1e3).toFixed(0) + ' KB';
const speed = (n) => fmt(n) + '/s';
const say = (t) => { $('msg').textContent = t || ''; };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + token(), ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

$('add').onclick = async () => {
  try { say(''); await api('/api/add', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ magnet: $('magnet').value.trim() }) }); $('magnet').value = ''; tick(); }
  catch (e) { say(e.message); }
};
$('file').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { say(''); await api('/api/add', { method: 'POST', headers: { 'content-type': 'application/x-bittorrent' }, body: f }); tick(); }
  catch (err) { say(err.message); } finally { e.target.value = ''; }
};

function play(id, index) {
  const v = $('player');
  v.hidden = false;
  v.src = `/stream/${id}/${index}?t=${encodeURIComponent(token())}`;
  v.play().catch(() => {});
  v.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function remove(id) {
  if (!confirm('Delete this torrent and its files from the drive?')) return;
  try { await api('/api/torrents/' + id, { method: 'DELETE' }); tick(); } catch (e) { say(e.message); }
}

function render(list) {
  const box = $('list');
  box.replaceChildren();
  for (const t of list) {
    const card = document.createElement('div'); card.className = 'card';
    const pct = (t.progress * 100).toFixed(1);
    card.innerHTML = `<div class="name"></div><div class="meta"></div><div class="bar ${t.done ? 'done' : ''}"><i style="width:${pct}%"></i></div>`;
    card.querySelector('.name').textContent = t.name || t.id;
    card.querySelector('.meta').textContent = t.ready
      ? `${pct}% of ${fmt(t.length)} · ${t.done ? 'done' : speed(t.downloadSpeed)} · ${t.numPeers} peers`
      : `fetching metadata… ${t.numPeers} peers`;
    for (const f of t.files) {
      const row = document.createElement('div'); row.className = 'file';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = f.name;
      const s = document.createElement('small'); s.textContent = `${fmt(f.length)} · ${(f.progress * 100).toFixed(0)}%`;
      row.append(n, s);
      if (f.playableInBrowser) { const b = document.createElement('button'); b.textContent = 'Play'; b.onclick = () => play(t.id, f.index); row.append(b); }
      else if (/\.(mkv|avi)$/i.test(f.name)) { const m = document.createElement('small'); m.textContent = 'needs remux'; row.append(m); }
      card.append(row);
    }
    const del = document.createElement('button'); del.className = 'ghost'; del.textContent = 'Delete'; del.style.marginTop = '8px'; del.onclick = () => remove(t.id);
    card.append(del);
    box.append(card);
  }
}

let busy = false;
async function tick() {
  if (busy || !token()) return;
  busy = true;
  try { render(await api('/api/torrents')); say(''); } catch (e) { say(e.message); } finally { busy = false; }
}
setInterval(tick, 2000); tick();
</script>
</body>
</html>
