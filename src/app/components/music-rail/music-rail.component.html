<section class="mb-8" [attr.aria-label]="title()">
  <div class="mb-3 flex items-center gap-2">
    <h2 class="min-w-0 flex-1 truncate text-lg font-semibold" [title]="title()">{{ title() }}</h2>
    @if (link()) {
      <a [routerLink]="linkCommands()" class="flex-shrink-0 rounded-full px-3 py-2 text-sm text-gray-400 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">{{ linkLabel() }}</a>
    }
    <button type="button" (click)="scroll(-1)" aria-label="Scroll left"
      class="hidden h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-white/5 text-gray-300 hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 md:flex">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
    </button>
    <button type="button" (click)="scroll(1)" aria-label="Scroll right"
      class="hidden h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-white/5 text-gray-300 hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 md:flex">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </button>
  </div>
  <div #scroller
    class="-mx-4 flex snap-x snap-mandatory gap-4 overflow-x-auto scroll-px-4 px-4 pb-2 [scrollbar-width:none] md:mx-0 md:scroll-px-0 md:px-0 [&::-webkit-scrollbar]:hidden [&>*]:w-36 [&>*]:flex-shrink-0 [&>*]:snap-start sm:[&>*]:w-44">
    <ng-content />
  </div>
</section>
