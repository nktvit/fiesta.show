<nav aria-label="Music sections" class="border-b border-white/10 px-4 md:px-12 lg:px-16">
  <ul class="-mx-1 flex gap-2 overflow-x-auto px-1 py-3 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    @for (l of links; track l.path) {
      <li class="flex-shrink-0">
        <a [routerLink]="l.path" routerLinkActive #rla="routerLinkActive" [routerLinkActiveOptions]="l.match"
          ariaCurrentWhenActive="page"
          class="inline-flex h-10 items-center rounded-full px-4 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 motion-reduce:transition-none"
          [class]="rla.isActive ? 'bg-white text-black' : 'bg-white/5 text-gray-300 hover:text-white'">{{ l.label }}</a>
      </li>
    }
  </ul>
</nav>
