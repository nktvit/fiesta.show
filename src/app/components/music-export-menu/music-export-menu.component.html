<button #trigger type="button" (click)="toggle()" aria-haspopup="menu" [attr.aria-expanded]="open()" [disabled]="empty()"
  class="flex h-10 items-center gap-2 rounded-full bg-white/5 px-4 text-sm font-medium text-gray-300 hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 disabled:opacity-40">
  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0 5-5m-5 5-5-5M4 20h16" /></svg>
  Export
</button>
@if (open()) {
  <div role="menu" aria-label="Export playlist" (keydown)="onMenuKeydown($event)"
    class="absolute right-0 z-[60] mt-2 w-48 rounded-xl border border-white/10 bg-[#121212]/95 py-1 shadow-2xl backdrop-blur-md">
    @for (f of formats; track f.id) {
      <button type="button" role="menuitem" (click)="download(f)"
        class="flex h-10 w-full items-center px-4 text-left text-sm text-gray-200 hover:bg-white/10 focus:bg-white/10 focus:outline-none">
        {{ f.label }}<span class="ml-auto text-xs text-gray-400">.{{ f.ext }}</span>
      </button>
    }
    <div class="my-1 border-t border-white/10" role="separator"></div>
    <button type="button" role="menuitem" (click)="share()"
      class="flex h-10 w-full items-center px-4 text-left text-sm text-gray-200 hover:bg-white/10 focus:bg-white/10 focus:outline-none">
      Copy share link
    </button>
  </div>
}
